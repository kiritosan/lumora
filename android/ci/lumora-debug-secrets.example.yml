# 只把填写后的文件放在 CNB 机密仓库。不要把真实值提交到公开仓库。
# 用 prepare-debug-signing.ps1 生成，或从旧 debug.keystore 导入；永久复用同一密钥。
# 密钥库为 PKCS12，alias=androiddebugkey，store/key password=android。
# 密码是标准 debug 密码；安全性依赖密钥文件和 base64 内容始终保持私密。
allow_slugs:
  - '<your-org>/lumora'
allow_branches:
  - 'main'
  - 'master'
allow_events:
  - 'push'

LUMORA_DEBUG_KEYSTORE_B64: '<base64-encoded-dedicated-preview-keystore>'
