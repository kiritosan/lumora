# Lumora 发布签名机密 —— CNB 机密仓库文件模板（仅占位符）
#
# 用法：
#   1. 在你的 CNB 组织下新建机密仓库（如 <your-org>/lumora-secrets），
#      按本模板创建 lumora-app.yml 并填入真实值（请勿提交到本仓库）。
#   2. 把主仓库 .cnb.yml 流水线 anchor 内那行被注释的 imports 解开，
#      URL 指向本文件的 blob 地址。
#   3. allow_* 限制只有本仓库 main/master 的 push 事件能取用这些机密。
#   4. 变量为**顶层平铺**（CNB imports 注入 env 约定），不要包 env: 节点。
#
# 密钥须为拾光自己新生成的 PKCS12 密钥库（keytool -genkeypair -storetype PKCS12），
# 绝不要复用其它应用（如 news/TWA）的密钥与包名。四个变量必须**同时**配置，
# 缺一流水线显式失败，绝不静默降级为 debug/未签名包。

allow_slugs:
  - '<your-org>/lumora'
allow_branches:
  - 'main'
  - 'master'
allow_events:
  - 'push'

LUMORA_KEYSTORE_B64: '<base64-encoded-pkcs12-keystore>'
LUMORA_STORE_PASSWORD: '<keystore-store-password>'
LUMORA_KEY_ALIAS: '<key-alias>'
LUMORA_KEY_PASSWORD: '<key-password>'
